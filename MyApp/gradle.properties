org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# 注意：AGP 8.7 需要 JDK 17~21，不认 JDK 25。
# 如果你的机器上默认 java 版本不对，别在这里写死绝对路径（会泄漏本机环境），
# 二选一：
#   1. 设置环境变量 JAVA_HOME 指向 JDK 17/21 后再构建
#   2. 在 ~/.gradle/gradle.properties（用户级，不进仓库）里写 org.gradle.java.home=...
